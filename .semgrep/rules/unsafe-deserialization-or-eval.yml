rules:
  - id: unsafe-deserialization-or-eval
    languages: [python]
    severity: ERROR
    message: Do not deserialize untrusted data or execute dynamic code with pickle, marshal, yaml.load, eval, or exec.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: marshal.loads(...)
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=SafeLoader, ...)
      - pattern: eval(...)
      - pattern: exec(...)
    metadata:
      invariant: External input must not reach unsafe deserialization or dynamic execution.
