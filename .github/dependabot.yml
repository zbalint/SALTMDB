version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Version-update pull requests belong on develop, not the default branch.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # Wait seven days before proposing new releases for supply-chain hygiene.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /
    # Version-update pull requests belong on develop, not the default branch.
    target-branch: develop
    # Refresh the lockfile without changing the allowed pyproject.toml ranges.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
      day: monday
    # Wait seven days before proposing new releases for supply-chain hygiene.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
