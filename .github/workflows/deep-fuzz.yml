name: Deep fuzz

# The property tests in tests/test_fuzz_*.py run with the fast `ci` profile (100 examples, fixed
# seed) in every Python Test Suite run. This workflow runs the same tests with the `fuzz` profile
# (5000 examples per property, a fresh random seed each run) once a week and on demand, so new
# inputs are tried continuously. A failure prints a `Failing test case:` line with the failing input:
# pin it as an @example (see CONTRIBUTING.md) and fix the defect; never weaken the property.
# Scheduled workflows run on the default branch only.
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

# Read access is granted per job, not here.
permissions: {}

concurrency:
  group: deep-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.7"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Sync dev environment
        run: uv sync --locked --python 3.11 --extra dev

      - name: Run property tests with the fuzz profile
        env:
          PYTHONPATH: src
          HYPOTHESIS_PROFILE: fuzz
        run: uv run --no-sync pytest -q tests/test_fuzz_*.py --durations=5
