# Identify the SonarQube Cloud project.
sonar.projectKey=zbalint_SALTMDB
# Associate the project with the owner's SonarQube Cloud organization.
sonar.organization=zbalint
# Analyze application code and maintained top-level support scripts.
sonar.sources=src,hooks,scripts,examples,saltmdb_cli.py,saltmdb_server.py
# Avoid indexing hook tests as source files.
sonar.exclusions=hooks/tests/**
# Classify repository and hook test paths as tests.
sonar.tests=tests,hooks/tests
# Match the Python version used by CI.
sonar.python.version=3.11
# Import the coverage.py XML generated by the CI test job.
sonar.python.coverage.reportPaths=coverage.xml
# Report analysis without waiting for or enforcing the quality gate.
sonar.qualitygate.wait=false
